
      - name: Validate and repair Android preset
        shell: bash
        run: |
          set -euo pipefail

          FILE="neon-dash-runner/export_presets.cfg"
          KEYSTORE="$HOME/.android/debug.keystore"

          test -f neon-dash-runner/project.godot
          test -f "$FILE"
          test -s "$KEYSTORE"

          python3 - "$FILE" "$KEYSTORE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          keystore = sys.argv[2]
          lines = path.read_text().splitlines()

          current_section = None
          preset_found = False
          options_found = False
          updates = {
              "keystore/debug": keystore,
              "keystore/debug_user": "androiddebugkey",
              "keystore/debug_password": "android",
          }
          seen = set()
          output = []

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("[") and stripped.endswith("]"):
                  current_section = stripped
                  if current_section == "[preset.0]":
                      preset_found = True
                  elif current_section == "[preset.0.options]":
                      options_found = True

              if current_section == "[preset.0.options]":
                  key = stripped.split("=", 1)[0] if "=" in stripped else ""
                  if key in updates:
                      output.append(f'{key}="{updates[key]}"')
                      seen.add(key)
                      continue

              output.append(line)

          if not preset_found or not options_found:
              raise SystemExit(
                  "Expected Android preset [preset.0] and "
                  "[preset.0.options] were not found."
              )

          missing = set(updates) - seen
          if missing:
              raise SystemExit(
                  "Missing keystore options in preset: "
                  + ", ".join(sorted(missing))
              )

          path.write_text("\n".join(output) + "\n")

          print("Updated Android preset keystore settings:")
          for key, value in updates.items():
              print(f'{key}="{value}"')
          PY

          grep -nE '^keystore/debug' "$FILE"
