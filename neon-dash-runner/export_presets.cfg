
      - name: Validate and repair Android preset
        shell: bash
        run: |
          set -euo pipefail

          FILE="neon-dash-runner/export_presets.cfg"
          KEYSTORE="$HOME/.android/debug.keystore"

          test -f neon-dash-runner/project.godot
          test -f "$FILE"
          test -s "$KEYSTORE"

          python3 - "$FILE" "$KEYSTORE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          keystore = sys.argv[2]
          lines = path.read_text(encoding="utf-8").splitlines()

          preset_section = None
          options_section = None
          current_section = None
          preset_name = None

          for i, line in enumerate(lines):
              s = line.strip()

              if s.startswith("[") and s.endswith("]"):
                  current_section = s

              if current_section and s.startswith("name="):
                  if s == 'name="Android Debug"':
                      preset_section = current_section
                      break

          if preset_section is None:
              raise SystemExit(
                  'Cannot find name="Android Debug" in export_presets.cfg'
              )

          options_section = preset_section[:-1] + ".options]"

          if options_section not in [x.strip() for x in lines]:
              raise SystemExit(f"Missing section: {options_section}")

          start = next(
              i for i, line in enumerate(lines)
              if line.strip() == options_section
          )

          end = next(
              (i for i in range(start + 1, len(lines))
               if lines[i].strip().startswith("[")
               and lines[i].strip().endswith("]")),
              len(lines)
          )

          updates = {
              "keystore/debug": keystore,
              "keystore/debug_user": "androiddebugkey",
              "keystore/debug_password": "android",
          }

          output = lines[:start + 1]
          written = set()

          for line in lines[start + 1:end]:
              s = line.strip()
              key = s.split("=", 1)[0] if "=" in s else ""

              if key in updates:
                  if key not in written:
                      output.append(f'{key}="{updates[key]}"')
                      written.add(key)
              else:
                  output.append(line)

          for key, value in updates.items():
              if key not in written:
                  output.append(f'{key}="{value}"')

          output.extend(lines[end:])
          path.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8"
          )

          # Verify all settings inside the correct options section.
          updated = path.read_text(encoding="utf-8").splitlines()
          start = next(
              i for i, line in enumerate(updated)
              if line.strip() == options_section
          )
          end = next(
              (i for i in range(start + 1, len(updated))
               if updated[i].strip().startswith("[")
               and updated[i].strip().endswith("]")),
              len(updated)
          )

          actual = {}
          for line in updated[start + 1:end]:
              s = line.strip()
              if "=" in s:
                  key, value = s.split("=", 1)
                  actual[key] = value.strip().strip('"')

          for key, value in updates.items():
              if actual.get(key) != value:
                  raise SystemExit(f"Verification failed: {key}")

          print("Android Debug preset verified successfully.")
          print(f"Preset: {preset_section}")
          print(f"Options: {options_section}")
          print("All three keystore settings are configured.")
          PY

          grep -nE '^keystore/debug' "$FILE"
