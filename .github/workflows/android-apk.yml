
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "neon-dash-runner/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build and Sign Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"

          sdkmanager --sdk_root="$SDK" --install \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

          yes | sdkmanager --sdk_root="$SDK" --licenses || true

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install Godot 4.4.1 export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Verify Android tools and export templates
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          test -x "$JAVA_HOME/bin/java"
          test -x "$SDK/platform-tools/adb"
          test -x "$SDK/build-tools/35.0.1/apksigner"
          test -d "$SDK/platforms/android-35"

          godot --version

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"

          if [ ! -f "$TEMPLATE_DIR/android_debug.apk" ]; then
            echo "Android debug export template not found:"
            echo "$TEMPLATE_DIR"
            find "$HOME" -type f -name 'android_debug.apk' 2>/dev/null || true
            exit 1
          fi

      - name: Create debug signing key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android

      - name: Configure Godot Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Validate project and prepare preset
        shell: bash
        run: |
          set -euo pipefail

          FILE="neon-dash-runner/export_presets.cfg"

          test -f neon-dash-runner/project.godot
          test -f "$FILE"

          grep -Fq 'name="Android Debug"' "$FILE"
          grep -Fq 'platform="Android"' "$FILE"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("neon-dash-runner/export_presets.cfg")
          lines = path.read_text().splitlines()

          replacements = {
              "package/signed": "false",
          }

          for key, value in replacements.items():
              prefix = key + "="
              matches = [
                  i for i, line in enumerate(lines)
                  if line.strip().startswith(prefix)
              ]

              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected exactly one {key} option; "
                      f"found {len(matches)}"
                  )

              lines[matches[0]] = f'{key}={value}'

          path.write_text("\n".join(lines) + "\n")
          print("Godot APK signing disabled; signing will follow separately.")
          PY

          grep -nE '^name=|^platform=|^package/signed=' "$FILE"

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --editor \
            --path neon-dash-runner --quit

      - name: Export unsigned APK
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build"

          set +e
          godot --headless --verbose \
            --path neon-dash-runner \
            --export-debug "Android Debug" \
            "$GITHUB_WORKSPACE/build/NeonDashRunner-unsigned.apk" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/export.log"

          RESULT=${PIPESTATUS[0]}
          set -e

          if [ "$RESULT" -ne 0 ] || \
             [ ! -s "$GITHUB_WORKSPACE/build/NeonDashRunner-unsigned.apk" ]; then
            echo "Godot export failed; inspect export.log."
            exit 1
          fi

      - name: Sign APK with apksigner
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APK="$GITHUB_WORKSPACE/build/NeonDashRunner-unsigned.apk"
          SIGNED="$GITHUB_WORKSPACE/build/NeonDashRunner-debug.apk"

          "$SDK/build-tools/35.0.1/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED" \
            "$APK"

          "$SDK/build-tools/35.0.1/apksigner" verify --verbose "$SIGNED"

          test -s "$SIGNED"
          rm "$APK"

      - name: Generate checksum
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build"
          sha256sum NeonDashRunner-debug.apk > SHA256SUMS.txt

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeonDashRunner-Android-Debug
          path: |
            build/NeonDashRunner-debug.apk
            build/SHA256SUMS.txt
            build/export.log
          if-no-files-found: warn
          retention-days: 14
