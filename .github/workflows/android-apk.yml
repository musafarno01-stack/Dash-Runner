
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "neon-dash-runner/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          test -f neon-dash-runner/project.godot
          test -f neon-dash-runner/main.tscn
          test -f neon-dash-runner/main.gd
          test -f neon-dash-runner/export_presets.cfg

          grep -F 'name="Android Debug"' \
            neon-dash-runner/export_presets.cfg

      - name: Import project
        run: |
          godot --headless --editor \
            --path neon-dash-runner --quit

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          godot --headless \
            --path neon-dash-runner \
            --export-debug "Android Debug" \
            build/NeonDashRunner-debug.apk

          test -s build/NeonDashRunner-debug.apk

      - name: Generate SHA-256 checksum
        run: |
          sha256sum build/NeonDashRunner-debug.apk \
            > build/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonDashRunner-Android-Debug
          path: |
            build/NeonDashRunner-debug.apk
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
