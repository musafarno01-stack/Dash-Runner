
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "neon-dash-runner/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Verify project configuration
        run: |
          test -f neon-dash-runner/project.godot
          test -f neon-dash-runner/main.tscn
          test -f neon-dash-runner/main.gd

          if [ ! -f neon-dash-runner/export_presets.cfg ]; then
            echo "::error::Missing neon-dash-runner/export_presets.cfg. Create an Android export preset named Android Debug in Godot."
            exit 1
          fi

      - name: Import Godot project
        run: |
          godot --headless --editor \
            --path neon-dash-runner --quit

      - name: Export debug APK
        run: |
          mkdir -p build

          godot --headless \
            --path neon-dash-runner \
            --export-debug "Android Debug" \
            ../build/NeonDashRunner-debug.apk

          test -s build/NeonDashRunner-debug.apk

      - name: Generate checksum
        run: |
          sha256sum build/NeonDashRunner-debug.apk \
            > build/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonDashRunner-Android-Debug
          path: |
            build/NeonDashRunner-debug.apk
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
