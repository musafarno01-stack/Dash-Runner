
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "neon-dash-runner/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Export Android Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Android export settings
        shell: bash
        run: |
          set -euo pipefail

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_PATH"
          test -d "$SDK_PATH/platform-tools"
          test -n "${JAVA_HOME:-}"
          test -x "$JAVA_HOME/bin/java"

          mkdir -p "$HOME/.android" "$HOME/.config/godot"

          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_PATH"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

          echo "Android SDK: $SDK_PATH"
          echo "Java: $JAVA_HOME"
          godot --version

      - name: Verify project and export preset
        shell: bash
        run: |
          set -euo pipefail

          test -f neon-dash-runner/project.godot
          test -f neon-dash-runner/export_presets.cfg

          grep -Fq 'name="Android Debug"' \
            neon-dash-runner/export_presets.cfg

          echo "Project and Android Debug preset found."

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --editor --verbose \
            --path neon-dash-runner --quit

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build"

          godot --headless --verbose \
            --path neon-dash-runner \
            --export-debug "Android Debug" \
            "$GITHUB_WORKSPACE/build/NeonDashRunner-debug.apk" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/export.log"

          test -s "$GITHUB_WORKSPACE/build/NeonDashRunner-debug.apk"

      - name: Generate checksum
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build"
          sha256sum NeonDashRunner-debug.apk > SHA256SUMS.txt

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeonDashRunner-Android-Debug
          path: |
            build/NeonDashRunner-debug.apk
            build/SHA256SUMS.txt
            build/export.log
          if-no-files-found: warn
          retention-days: 14
