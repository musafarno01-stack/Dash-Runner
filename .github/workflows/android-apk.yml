
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "neon-dash-runner/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"

          sdkmanager --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

          yes | sdkmanager --sdk_root="$SDK" --licenses || true

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"

          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -s "$HOME/.android/debug.keystore"

      - name: Configure Godot Android settings
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Validate and repair Android preset
        shell: bash
        run: |
          set -euo pipefail

          FILE="neon-dash-runner/export_presets.cfg"
          KEYSTORE="$HOME/.android/debug.keystore"

          test -f neon-dash-runner/project.godot
          test -f "$FILE"
          test -s "$KEYSTORE"

          python3 - "$FILE" "$KEYSTORE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          keystore = sys.argv[2]
          lines = path.read_text().splitlines()

          # Find the Android Debug preset by its name.
          preset_index = None
          section = None

          for i, line in enumerate(lines):
              s = line.strip()

              if s.startswith("[") and s.endswith("]"):
                  section = s

              if section == "[preset.0]" and s == 'name="Android Debug"':
                  preset_index = 0
                  break

          if preset_index is None:
              raise SystemExit(
                  'Android Debug preset [preset.0] not found.'
              )

          options_section = "[preset.0.options]"
          try:
              start = next(
                  i for i, line in enumerate(lines)
                  if line.strip() == options_section
              )
          except StopIteration:
              raise SystemExit(
                  "Missing [preset.0.options] section."
              )

          end = len(lines)
          for i in range(start + 1, len(lines)):
              s = lines[i].strip()
              if s.startswith("[") and s.endswith("]"):
                  end = i
                  break

          updates = {
              "keystore/debug": keystore,
              "keystore/debug_user": "androiddebugkey",
              "keystore/debug_password": "android",
          }

          seen = set()
          output = lines[:start + 1]

          for line in lines[start + 1:end]:
              stripped = line.strip()
              key = stripped.split("=", 1)[0] if "=" in stripped else ""

              if key in updates:
                  output.append(f'{key}="{updates[key]}"')
                  seen.add(key)
              else:
                  output.append(line)

          for key, value in updates.items():
              if key not in seen:
                  output.append(f'{key}="{value}"')

          output.extend(lines[end:])
          path.write_text("\n".join(output) + "\n")

          print("Android preset keystore settings repaired.")
          for key, value in updates.items():
              print(f'{key}="{value}"')
          PY

          grep -nE '^keystore/debug' "$FILE"

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor \
            --path neon-dash-runner --quit

      - name: Export signed Debug APK
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"

          set +e
          godot --headless --verbose \
            --path neon-dash-runner \
            --export-debug "Android Debug" \
            "$GITHUB_WORKSPACE/build/NeonDashRunner-debug.apk" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/export.log"

          RESULT=${PIPESTATUS[0]}
          set -e

          if [ "$RESULT" -ne 0 ] || \
             [ ! -s "$GITHUB_WORKSPACE/build/NeonDashRunner-debug.apk" ]; then
            echo "Godot export failed; see export.log."
            exit 1
          fi

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          "$SDK/build-tools/35.0.1/apksigner" verify --verbose \
            "$GITHUB_WORKSPACE/build/NeonDashRunner-debug.apk"

      - name: Generate checksum
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build"
          sha256sum NeonDashRunner-debug.apk > SHA256SUMS.txt

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeonDashRunner-Android-Debug
          path: |
            build/NeonDashRunner-debug.apk
            build/SHA256SUMS.txt
            build/export.log
          if-no-files-found: warn
          retention-days: 14
