
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "neon-dash-runner/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"

          sdkmanager --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

          yes | sdkmanager --sdk_root="$SDK" --licenses || true

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Verify tools and export templates
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          test -x "$JAVA_HOME/bin/java"
          test -x "$SDK/platform-tools/adb"
          test -x "$SDK/build-tools/35.0.1/apksigner"
          test -d "$SDK/platforms/android-35"

          godot --version

          TEMPLATE="$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"

          if [ ! -f "$TEMPLATE" ]; then
            echo "Expected Android debug export template not found."
            find "$HOME" -type f -name android_debug.apk 2>/dev/null || true
            exit 1
          fi

      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android

      - name: Configure Godot Android settings
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SETTINGS="$HOME/.config/godot"
          mkdir -p "$SETTINGS"

          cat > "$SETTINGS/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Validate and repair Android preset
        shell: bash
        run: |
          set -euo pipefail

          FILE="neon-dash-runner/export_presets.cfg"
          KEYSTORE="$HOME/.android/debug.keystore"

          test -f "neon-dash-runner/project.godot"
          test -f "$FILE"
          test -s "$KEYSTORE"

          python3 - "$FILE" "$KEYSTORE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          keystore = sys.argv[2]
          lines = path.read_text(encoding="utf-8").splitlines()

          # Find the actual Android preset by its platform.
          sections = {}
          current = None

          for i, line in enumerate(lines):
              s = line.strip()
              if s.startswith("[") and s.endswith("]"):
                  current = s
                  sections.setdefault(current, [])
              elif current is not None:
                  sections[current].append((i, s))

          android_presets = []

          for section, entries in sections.items():
              match = re.fullmatch(r"\[preset\.(\d+)\]", section)
              if not match:
                  continue

              values = dict(
                  item.split("=", 1)
                  for _, item in entries
                  if "=" in item
              )

              if values.get("platform", "").strip('"') == "Android":
                  android_presets.append(
                      (int(match.group(1)), section, values)
                  )

          if not android_presets:
              raise SystemExit(
                  "No Android preset exists in export_presets.cfg."
              )

          chosen = next(
              (
                  item for item in android_presets
                  if item[2].get("name", "").strip('"')
                  == "Android Debug"
              ),
              None,
          )

          if chosen is None:
              raise SystemExit(
                  'No Android preset named "Android Debug" was found. '
                  "Check the preset name in Godot."
              )

          index, preset_section, values = chosen
          options_section = f"[preset.{index}.options]"

          if options_section not in sections:
              raise SystemExit(
                  f"Missing {options_section} in export_presets.cfg."
              )

          start = next(
              i for i, line in enumerate(lines)
              if line.strip() == options_section
          )

          end = next(
              (
                  i for i in range(start + 1, len(lines))
                  if lines[i].strip().startswith("[")
                  and lines[i].strip().endswith("]")
              ),
              len(lines),
          )

          updates = {
              "keystore/debug": keystore,
              "keystore/debug_user": "androiddebugkey",
              "keystore/debug_password": "android",
          }

          output = lines[:start + 1]
          seen = set()

          for line in lines[start + 1:end]:
              stripped = line.strip()
              key = stripped.split("=", 1)[0] if "=" in stripped else ""

              if key in updates:
                  if key not in seen:
                      output.append(f'{key}="{updates[key]}"')
                      seen.add(key)
              else:
                  output.append(line)

          for key, value in updates.items():
              if key not in seen:
                  output.append(f'{key}="{value}"')

          output.extend(lines[end:])
          path.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8",
          )

          # Verify the exact section that was updated.
          saved = path.read_text(encoding="utf-8").splitlines()
          start = next(
              i for i, line in enumerate(saved)
              if line.strip() == options_section
          )
          end = next(
              (
                  i for i in range(start + 1, len(saved))
                  if saved[i].strip().startswith("[")
                  and saved[i].strip().endswith("]")
              ),
              len(saved),
          )

          actual = {}
          for line in saved[start + 1:end]:
              stripped = line.strip()
              if "=" in stripped:
                  key, value = stripped.split("=", 1)
                  actual[key] = value.strip().strip('"')

          for key, value in updates.items():
              if actual.get(key) != value:
                  raise SystemExit(
                      f"Preset verification failed for {key}."
                  )

          print(f"Verified preset: {preset_section}")
          print(f"Verified options: {options_section}")
          print("All three debug keystore settings are configured.")
          PY

          grep -nE '^name=|^platform=|^keystore/debug' "$FILE"

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --editor \
            --path neon-dash-runner \
            --quit

      - name: Export Android Debug APK
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build"

          set +e
          godot --headless --verbose \
            --path neon-dash-runner \
            --export-debug "Android Debug" \
            "$GITHUB_WORKSPACE/build/NeonDashRunner-debug.apk" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/export.log"

          RESULT=${PIPESTATUS[0]}
          set -e

          if [ "$RESULT" -ne 0 ] || \
             [ ! -s "$GITHUB_WORKSPACE/build/NeonDashRunner-debug.apk" ]; then
            echo "Godot Android export failed."
            exit 1
          fi

          echo "APK export completed."

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APK="$GITHUB_WORKSPACE/build/NeonDashRunner-debug.apk"

          "$SDK/build-tools/35.0.1/apksigner" verify --verbose "$APK"
          test -s "$APK"

      - name: Generate checksum
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/build"
          sha256sum NeonDashRunner-debug.apk > SHA256SUMS.txt

      - name: Upload APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeonDashRunner-Android-Debug
          path: |
            build/NeonDashRunner-debug.apk
            build/SHA256SUMS.txt
            build/export.log
          if-no-files-found: warn
          retention-days: 14
