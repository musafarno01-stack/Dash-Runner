
      - name: Export iOS Xcode project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build/ios"

          godot --headless \
            --path "$GITHUB_WORKSPACE/neon-dash-runner" \
            --export-debug "iOS" \
            "$GITHUB_WORKSPACE/build/ios"

          PROJECT="$(find "$GITHUB_WORKSPACE/build/ios" \
            -maxdepth 3 -name '*.xcodeproj' -print -quit)"

          if [[ -z "$PROJECT" ]]; then
            echo "ERROR: No Xcode project was exported."
            exit 1
          fi

          echo "XCODE_PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Archive and export signed IPA
        shell: bash
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ secrets.APPLE_PROVISIONING_PROFILE_UUID }}
        run: |
          set -euo pipefail

          if [[ -z "$TEAM_ID" || -z "$PROFILE_UUID" ]]; then
            echo "ERROR: Configure APPLE_TEAM_ID and APPLE_PROVISIONING_PROFILE_UUID."
            exit 1
          fi

          PROJECT="$XCODE_PROJECT"
          BUNDLE_ID="com.musafarno01.neondashrunner"
          ARCHIVE="$GITHUB_WORKSPACE/build/NeonDashRunner.xcarchive"
          EXPORT_DIR="$GITHUB_WORKSPACE/build/ipa"

          mkdir -p "$EXPORT_DIR"

          SCHEME="$(xcodebuild -list -json -project "$PROJECT" |
            python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          p = d["project"]
          schemes = p.get("schemes", [])
          if not schemes:
              raise SystemExit("ERROR: No Xcode scheme found.")
          print(schemes[0])
          ')"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            archive

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          IPA="$(find "$EXPORT_DIR" -maxdepth 1 \
            -type f -name '*.ipa' -print -quit)"

          if [[ -z "$IPA" ]]; then
            echo "ERROR: IPA file was not generated."
            exit 1
          fi

          cp "$IPA" "$GITHUB_WORKSPACE/build/NeonDashRunner.ipa"

          echo "IPA successfully created:"
          ls -lh "$GITHUB_WORKSPACE/build/NeonDashRunner.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonDashRunner-IPA
          path: build/NeonDashRunner.ipa
          if-no-files-found: error
          retention-days: 14
