
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail

          VERSION="4.4.1"
          URL="https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_macos.universal.zip"

          curl -fL "$URL" -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"

          GODOT_BIN="$(find "$RUNNER_TEMP/godot" \
            -type f -name Godot -perm -111 -print -quit)"

          if [[ -z "$GODOT_BIN" ]]; then
            echo "::error::Godot executable not found."
            find "$RUNNER_TEMP/godot" -maxdepth 5 -print
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Install iOS export templates
        shell: bash
        run: |
          set -euo pipefail

          VERSION="4.4.1"
          URL="https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_export_templates.tpz"

          curl -fL "$URL" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/templates.tpz" \
            -d "$RUNNER_TEMP/templates"

          SOURCE="$(find "$RUNNER_TEMP/templates" \
            -type d -name templates -print -quit)"

          if [[ -z "$SOURCE" ]]; then
            echo "::error::Export templates not found."
            exit 1
          fi

          DEST="$HOME/Library/Application Support/Godot/export_templates/4.4.1.stable"
          mkdir -p "$DEST"
          cp -R "$SOURCE/." "$DEST/"

      - name: Install Apple signing certificate
        shell: bash
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "$P12_BASE64" || -z "$PROFILE_BASE64" ]]; then
            echo "::error::Missing Apple certificate or provisioning profile secrets."
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$P12_BASE64" |
            base64 -D > "$RUNNER_TEMP/certificate.p12"

          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          printf '%s' "$PROFILE_BASE64" |
            base64 -D > "$RUNNER_TEMP/profile.mobileprovision"

          security cms -D \
            -i "$RUNNER_TEMP/profile.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c 'Print UUID' "$RUNNER_TEMP/profile.plist")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Export iOS project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$GITHUB_WORKSPACE/neon-dash-runner"
          OUTPUT_DIR="$GITHUB_WORKSPACE/build/ios"

          if [[ ! -f "$PROJECT_DIR/project.godot" ]]; then
            echo "::error::Godot project folder not found."
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/export_presets.cfg" ]]; then
            echo "::error::Missing export_presets.cfg."
            exit 1
          fi

          mkdir -p "$OUTPUT_DIR"

          "$GODOT_BIN" --headless --verbose \
            --path "$PROJECT_DIR" \
            --export-debug "iOS" \
            "$OUTPUT_DIR/NeonDashRunner.zip"

          if [[ ! -s "$OUTPUT_DIR/NeonDashRunner.zip" ]]; then
            echo "::error::Godot export failed."
            exit 1
          fi

          mkdir -p "$OUTPUT_DIR/extracted"

          unzip -q "$OUTPUT_DIR/NeonDashRunner.zip" \
            -d "$OUTPUT_DIR/extracted"

          PROJECT="$(find "$OUTPUT_DIR/extracted" \
            -type d -name '*.xcodeproj' -print -quit)"

          if [[ -z "$PROJECT" ]]; then
            echo "::error::No Xcode project found in export ZIP."
            find "$OUTPUT_DIR/extracted" -maxdepth 4 -print
            exit 1
          fi

          echo "XCODE_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT"

      - name: Archive and export signed IPA
        shell: bash
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          BUNDLE_ID="com.musafarno01.neondashrunner"
          ARCHIVE="$GITHUB_WORKSPACE/build/NeonDashRunner.xcarchive"
          EXPORT_DIR="$GITHUB_WORKSPACE/build/ipa"

          if [[ -z "$TEAM_ID" ]]; then
            echo "::error::Missing APPLE_TEAM_ID secret."
            exit 1
          fi

          mkdir -p "$EXPORT_DIR"

          SCHEME="$(xcodebuild -list -json \
            -project "$XCODE_PROJECT" |
            python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          schemes=d["project"].get("schemes",[])
          if not schemes:
              raise SystemExit("No Xcode scheme found")
          print(schemes[0])
          ')"

          echo "Building scheme: $SCHEME"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            archive

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          IPA="$(find "$EXPORT_DIR" \
            -maxdepth 1 -type f -name '*.ipa' -print -quit)"

          if [[ -z "$IPA" ]]; then
            echo "::error::IPA was not generated."
            exit 1
          fi

          cp "$IPA" "$GITHUB_WORKSPACE/build/NeonDashRunner.ipa"
          ls -lh "$GITHUB_WORKSPACE/build/NeonDashRunner.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeonDashRunner-IPA
          path: build/NeonDashRunner.ipa
          if-no-files-found: error
          retention-days: 14
