
name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      GODOT_VERSION: "4.4.1"
      PROJECT_DIR: neon-dash-runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/project.godot" || {
            echo "::error::Godot project not found"
            exit 1
          }

          test -f "$PROJECT_DIR/export_presets.cfg" || {
            echo "::error::export_presets.cfg not found"
            exit 1
          }

          echo "Godot project found."

      - name: Install Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"

          curl -fL --retry 3 "$URL" \
            -o "$RUNNER_TEMP/godot.zip"

          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" \
            -d "$RUNNER_TEMP/godot"

          GODOT_BIN="$(find "$RUNNER_TEMP/godot" \
            -type f -name Godot -perm -111 -print -quit)"

          if [[ -z "$GODOT_BIN" ]]; then
            echo "::error::Godot executable not found"
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          curl -fL --retry 3 "$URL" \
            -o "$RUNNER_TEMP/templates.tpz"

          mkdir -p "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/templates.tpz" \
            -d "$RUNNER_TEMP/templates"

          SOURCE="$RUNNER_TEMP/templates/templates"

          if [[ ! -d "$SOURCE" ]]; then
            SOURCE="$(find "$RUNNER_TEMP/templates" \
              -type d -name templates -print -quit)"
          fi

          if [[ -z "$SOURCE" || ! -d "$SOURCE" ]]; then
            echo "::error::Export templates not found"
            exit 1
          fi

          DEST="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$DEST"
          cp -R "$SOURCE/." "$DEST/"

          if [[ ! -s "$DEST/ios.zip" ]]; then
            echo "::error::iOS export template missing"
            exit 1
          fi

          echo "iOS templates installed."

      - name: Configure iOS export preset
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR/export_presets.cfg" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          section = "[preset.1.options]"
          if section not in text:
              raise SystemExit(
                  "iOS options section [preset.1.options] not found"
              )

          before, rest = text.split(section, 1)
          lines = rest.splitlines()

          values = {
              "application/app_store_team_id": "AAAAAAAAAA",
              "application/identifier":
                  "com.musafarno01.neondashrunner",
          }

          found = set()

          for i, line in enumerate(lines):
              stripped = line.strip()

              for key, value in values.items():
                  if stripped.startswith(key + "="):
                      lines[i] = f'{key}="{value}"'
                      found.add(key)

          for key, value in values.items():
              if key not in found:
                  lines.insert(0, f'{key}="{value}"')

          path.write_text(
              before + section + "\n" + "\n".join(lines) + "\n"
          )

          print("Updated iOS bundle identifier.")
          print("Set placeholder Team ID for unsigned export attempt.")
          PY

      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" --headless \
            --path "$PROJECT_DIR" \
            --editor --import --quit

      - name: Export iOS Xcode project
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/build/ios"
          mkdir -p "$OUTPUT"

          "$GODOT_BIN" --headless --verbose \
            --path "$PROJECT_DIR" \
            --export-debug "iOS" \
            "$OUTPUT/NeonDashRunner.zip"

          ZIP="$OUTPUT/NeonDashRunner.zip"

          test -s "$ZIP" || {
            echo "::error::Godot iOS export failed"
            exit 1
          }

          EXTRACT="$OUTPUT/extracted"
          mkdir -p "$EXTRACT"
          unzip -q "$ZIP" -d "$EXTRACT"

          XCODE_PROJECT="$(find "$EXTRACT" \
            -type d -name '*.xcodeproj' -print -quit)"

          if [[ -z "$XCODE_PROJECT" ]]; then
            echo "::error::No Xcode project found"
            find "$EXTRACT" -maxdepth 5 -print
            exit 1
          fi

          echo "XCODE_PROJECT=$XCODE_PROJECT" >> "$GITHUB_ENV"
          echo "Found Xcode project: $XCODE_PROJECT"

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          DERIVED="$RUNNER_TEMP/DerivedData"

          SCHEMES="$(xcodebuild -list -json \
            -project "$XCODE_PROJECT")"

          SCHEME="$(printf '%s' "$SCHEMES" |
            python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          schemes = data.get("project", {}).get("schemes", [])
          if not schemes:
              raise SystemExit("No Xcode scheme found")
          print(schemes[0])
          ')"

          echo "Building scheme: $SCHEME"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          APP_DIR="$DERIVED/Build/Products/Release-iphoneos"

          APP_PATH="$(find "$APP_DIR" \
            -maxdepth 2 -type d -name '*.app' -print -quit)"

          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
            echo "::error::Unsigned iOS app was not built"
            find "$DERIVED/Build/Products" \
              -maxdepth 4 -print || true
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Unsigned app built."

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/build/unsigned-ipa"
          mkdir -p "$OUTPUT/Payload"

          ditto "$APP_PATH" \
            "$OUTPUT/Payload/NeonDashRunner.app"

          (
            cd "$OUTPUT"
            /usr/bin/zip -qry \
              "$GITHUB_WORKSPACE/build/NeonDashRunner.ipa" \
              Payload
          )

          IPA="$GITHUB_WORKSPACE/build/NeonDashRunner.ipa"

          test -s "$IPA" || {
            echo "::error::IPA was not created"
            exit 1
          }

          echo "IPA package created:"
          ls -lh "$IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonDashRunner-Unsigned-IPA
          path: build/NeonDashRunner.ipa
          if-no-files-found: error
          retention-days: 14
