
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      GODOT_VERSION: "4.4.1"
      BUNDLE_ID: com.musafarno01.neondashrunner
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PROJECT_DIR: neon-dash-runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate secrets and environment
        shell: bash
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          for name in P12_BASE64 P12_PASSWORD PROFILE_BASE64 TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required signing secret is missing: $name"
              exit 1
            fi
          done

          if [[ ! "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID must be a 10-character Apple Team ID."
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/project.godot" ]]; then
            echo "::error::Missing $PROJECT_DIR/project.godot"
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/export_presets.cfg" ]]; then
            echo "::error::Missing $PROJECT_DIR/export_presets.cfg"
            exit 1
          fi

          echo "Required secrets and project files are present."

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          xcode-select -p
          xcodebuild -version

          if ! xcodebuild -showsdks | grep -q 'iphoneos'; then
            echo "::error::The selected Xcode installation has no iOS SDK."
            exit 1
          fi

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$GODOT_VERSION"
          URL="https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_macos.universal.zip"

          curl --fail --location --retry 3 \
            "$URL" -o "$RUNNER_TEMP/godot.zip"

          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" \
            -d "$RUNNER_TEMP/godot"

          GODOT_BIN="$(find "$RUNNER_TEMP/godot" \
            -type f -name Godot -perm -111 -print -quit)"

          if [[ -z "$GODOT_BIN" ]]; then
            echo "::error::Godot executable was not found."
            find "$RUNNER_TEMP/godot" -maxdepth 5 -print
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$GODOT_VERSION"
          URL="https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_export_templates.tpz"

          curl --fail --location --retry 3 \
            "$URL" -o "$RUNNER_TEMP/templates.tpz"

          mkdir -p "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/templates.tpz" \
            -d "$RUNNER_TEMP/templates"

          SOURCE="$RUNNER_TEMP/templates/templates"

          if [[ ! -d "$SOURCE" ]]; then
            SOURCE="$(find "$RUNNER_TEMP/templates" \
              -type d -name templates -print -quit)"
          fi

          if [[ -z "$SOURCE" || ! -d "$SOURCE" ]]; then
            echo "::error::Godot templates directory not found."
            exit 1
          fi

          DEST="$HOME/Library/Application Support/Godot/export_templates/${VERSION}.stable"

          mkdir -p "$DEST"
          cp -R "$SOURCE/." "$DEST/"

          if [[ ! -s "$DEST/ios.zip" ]]; then
            echo "::error::Godot iOS template ios.zip is missing."
            find "$DEST" -maxdepth 2 -print
            exit 1
          fi

          echo "Godot iOS templates installed."

      - name: Install Apple signing assets
        shell: bash
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$P12_BASE64" |
            base64 -D > "$RUNNER_TEMP/certificate.p12"

          printf '%s' "$PROFILE_BASE64" |
            base64 -D > "$RUNNER_TEMP/profile.mobileprovision"

          [[ -s "$RUNNER_TEMP/certificate.p12" ]] || {
            echo "::error::Decoded P12 file is empty."
            exit 1
          }

          [[ -s "$RUNNER_TEMP/profile.mobileprovision" ]] || {
            echo "::error::Decoded provisioning profile is empty."
            exit 1
          }

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security set-keychain-settings \
            -lut 21600 "$KEYCHAIN"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security list-keychains -d user -s \
            "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"

          security default-keychain -d user -s "$KEYCHAIN"

          security find-identity -v -p codesigning "$KEYCHAIN" \
            | tee "$RUNNER_TEMP/identities.txt"

          if ! grep -q 'Apple Distribution:' \
            "$RUNNER_TEMP/identities.txt"; then
            echo "::error::No valid Apple Distribution identity found."
            exit 1
          fi

          security cms -D \
            -i "$RUNNER_TEMP/profile.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c 'Print UUID' "$RUNNER_TEMP/profile.plist")

          PROFILE_TEAM=$(/usr/libexec/PlistBuddy \
            -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")

          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:application-identifier' \
            "$RUNNER_TEMP/profile.plist")

          if [[ "$PROFILE_TEAM" != "$TEAM_ID" ]]; then
            echo "::error::Profile Team ID does not match APPLE_TEAM_ID."
            exit 1
          fi

          if ! PROFILE_APP_ID="$PROFILE_APP_ID" \
            TEAM_ID="$TEAM_ID" BUNDLE_ID="$BUNDLE_ID" \
            python3 - <<'PY'
          import os, sys

          app_id = os.environ["PROFILE_APP_ID"]
          team = os.environ["TEAM_ID"]
          bundle = os.environ["BUNDLE_ID"]

          prefix = team + "."
          if not app_id.startswith(prefix):
              sys.exit("Profile application identifier has the wrong team prefix")

          pattern = app_id[len(prefix):]

          matches = (
              pattern == bundle
              or (
                  pattern.endswith(".*")
                  and bundle.startswith(pattern[:-2] + ".")
              )
          )

          if not matches:
              sys.exit(
                  f"Profile identifier {app_id!r} does not match {bundle!r}"
              )
          PY
          then
            echo "::error::Provisioning profile does not match the bundle ID."
            exit 1
          fi

          EXPIRATION=$(/usr/libexec/PlistBuddy \
            -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")

          EXPIRATION="$EXPIRATION" python3 - <<'PY'
          import os
          import sys
          from datetime import datetime, timezone

          raw = os.environ["EXPIRATION"]
          expiry = datetime.fromisoformat(raw.replace("Z", "+00:00"))

          if expiry <= datetime.now(timezone.utc):
              sys.exit("Provisioning profile has expired")
          PY

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          {
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "GODOT_IOS_PROVISIONING_PROFILE_UUID_DEBUG=$PROFILE_UUID"
            echo "GODOT_IOS_PROVISIONING_PROFILE_UUID_RELEASE=$PROFILE_UUID"
          } >> "$GITHUB_ENV"

          echo "Provisioning profile validated and installed."

      - name: Import Godot project resources
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" --headless \
            --path "$PROJECT_DIR" \
            --editor --import --quit

      - name: Export Godot iOS project
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="$GITHUB_WORKSPACE/build/ios"
          EXTRACT_DIR="$OUTPUT_DIR/extracted"

          mkdir -p "$OUTPUT_DIR" "$EXTRACT_DIR"

          "$GODOT_BIN" --headless --verbose \
            --path "$PROJECT_DIR" \
            --export-release "iOS" \
            "$OUTPUT_DIR/NeonDashRunner.zip"

          ZIP="$OUTPUT_DIR/NeonDashRunner.zip"

          if [[ ! -s "$ZIP" ]]; then
            echo "::error::Godot did not generate the export ZIP."
            exit 1
          fi

          unzip -q "$ZIP" -d "$EXTRACT_DIR"

          PROJECT="$(find "$EXTRACT_DIR" \
            -type d -name '*.xcodeproj' -print -quit)"

          if [[ -z "$PROJECT" ]]; then
            echo "::error::Export ZIP contains no Xcode project."
            find "$EXTRACT_DIR" -maxdepth 5 -print
            exit 1
          fi

          echo "XCODE_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Found Xcode project: $PROJECT"

      - name: Archive and export IPA
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/build/NeonDashRunner.xcarchive"
          EXPORT_DIR="$GITHUB_WORKSPACE/build/ipa"
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"

          mkdir -p "$EXPORT_DIR"

          SCHEMES_JSON="$(xcodebuild -list -json \
            -project "$XCODE_PROJECT")"

          SCHEME="$(printf '%s' "$SCHEMES_JSON" |
            python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          schemes = data.get("project", {}).get("schemes", [])
          if not schemes:
              raise SystemExit("No Xcode scheme found")
          print(schemes[0])
          ')"

          echo "Building scheme: $SCHEME"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            archive

          [[ -d "$ARCHIVE" ]] || {
            echo "::error::Xcode archive was not created."
            exit 1
          }

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          IPA="$(find "$EXPORT_DIR" \
            -maxdepth 1 -type f -name '*.ipa' -print -quit)"

          if [[ -z "$IPA" || ! -s "$IPA" ]]; then
            echo "::error::Xcode did not generate an IPA."
            find "$EXPORT_DIR" -maxdepth 3 -print
            exit 1
          fi

          cp "$IPA" "$GITHUB_WORKSPACE/build/NeonDashRunner.ipa"

          echo "IPA created:"
          ls -lh "$GITHUB_WORKSPACE/build/NeonDashRunner.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeonDashRunner-IPA
          path: build/NeonDashRunner.ipa
          if-no-files-found: error
          retention-days: 14
